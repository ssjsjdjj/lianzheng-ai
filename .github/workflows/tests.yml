name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LZ_DATABASE: data/ci.sqlite3
      LZ_LLM_PROVIDER: ""
      LZ_LLM_BASE_URL: ""
      LZ_LLM_API_KEY: ""
      LZ_LLM_MODEL: ""
      OPENAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      LZ_EMBEDDING_BASE_URL: ""
      LZ_EMBEDDING_API_KEY: ""
      LZ_EMBEDDING_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run local functional checks
        run: python scripts/evaluate.py evaluation/ci-smoke-results.json
      - name: Run offline development comparison
        run: python scripts/benchmark.py --split dev --output evaluation/ci-benchmark.json
      - name: Verify frozen public project imports
        run: python scripts/verify_public_projects.py --require-supported
      - name: Verify frozen real-case evidence
        run: python scripts/verify_real_case.py --require-passed --output evaluation/ci-real-case-results.json
      - name: Verify shared-corpus real task comparison
        run: python scripts/verify_task_comparison.py --require-passed --output evaluation/ci-task-comparison-results.json
      - name: Upload functional check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-functional-checks
          path: |
            evaluation/ci-smoke-results.json
            evaluation/ci-benchmark.json
            evaluation/ci-benchmark.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload real-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-case-evidence
          path: |
            evaluation/ci-real-case-results.json
            fixtures/real-case/http-server-minimist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload real task comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-task-comparison
          path: |
            evaluation/ci-task-comparison-results.json
            fixtures/task-comparison.json
          if-no-files-found: error
          retention-days: 7
